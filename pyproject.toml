[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redact-suite"
version = "0.2.0"
description = "A unified redaction suite that ingests any document and routes it to the best available PII/PHI redaction backend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "redact-suite contributors" }]
keywords = ["pii", "phi", "redaction", "anonymization", "presidio", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The suite runs with zero third-party dependencies (the built-in regex backend
# and stdlib-only HTTP adapters). Heavy tools are opt-in "extras" so a user only
# installs the backend they intend to use.
dependencies = []

[project.optional-dependencies]
# presidio-anonymizer is intentionally absent: the suite uses Presidio for
# detection only and does its own rewriting, so requiring it would be a lie.
presidio = ["presidio-analyzer"]
pdf = ["pypdf>=3.0"]
# Face blurring for images/video: ships its own ONNX model and a static ffmpeg.
deface = ["deface>=1.5"]
# Open-vocabulary detection (license plates, prompt-driven). imageio is part of
# this runtime path, and imageio-ffmpeg supplies the portable video codec binary.
yolo = ["ultralytics>=8.3", "opencv-python", "imageio", "imageio-ffmpeg"]
# CLIP semantic search over images and video frames.
semantic = ["torch", "clip @ git+https://github.com/openai/CLIP.git", "pillow", "imageio"]
# NOTE: understand-ai's Anonymizer is a git checkout, not a PyPI package (the
# PyPI "anonymizer" project is unrelated) — see backends/anonymizer.py.
# Keep the light media stack in dev so CI exercises end-to-end video reopen and
# verification instead of silently skipping the new privacy-safety gate.
dev = ["pytest>=7", "numpy", "imageio", "imageio-ffmpeg"]
# convenience meta-extra
# Every pip-installable backend. Kept in sync with the extras above — the
# README promises this installs all of them, so omissions are a broken promise.
all = [
    "presidio-analyzer",
    "pypdf>=3.0",
    "deface>=1.5",
    "ultralytics>=8.3",
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    "torch",
    "clip @ git+https://github.com/openai/CLIP.git",
    "pillow",
]

[project.scripts]
redact = "redact.cli:main"

[project.urls]
Homepage = "https://github.com/sps18209/redact"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
